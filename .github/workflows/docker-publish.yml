name: Build and Publish Backend Image

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: velmio-backend-publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build and Publish Docker Image

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Generate lowercase image name
      # ======================================================

      - name: Set image name
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$OWNER/velmio-backend" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Configure Docker Buildx
      # ======================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================================
      # Authenticate with GHCR
      # ======================================================

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================
      # Generate Docker metadata
      # ======================================================

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      # ======================================================
      # Build and publish Docker image
      # ======================================================

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
            context: .
            file: ./server/Dockerfile
            platforms: linux/amd64
            push: true
            tags: ${{ steps.metadata.outputs.tags }}
            labels: ${{ steps.metadata.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

      # ======================================================
      # Display published image
      # ======================================================

      - name: Publish summary
        run: |
          echo "## Velmio Backend Image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.image.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"