[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.3.1",
    "cloudinary>=1.47.0",
    "docx2txt>=0.9",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.162.0",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pinecone>=7.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.15.1",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["I", "E", "F"]
ignore = ["I001", "E501", "F401"]
