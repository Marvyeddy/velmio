<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{% block title %}Velmio{% endblock %}</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f5f7;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
">

    <table width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color: #f4f5f7; padding: 40px 15px;">

        <tr>
            <td align="center">

                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="
                           max-width: 560px;
                           background-color: #ffffff;
                           border-radius: 12px;
                           overflow: hidden;
                       ">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 35px 30px 20px;">
                            <h1 style="
                                margin: 0;
                                font-size: 28px;
                                font-weight: 700;
                                letter-spacing: -1px;
                                color: #4f46e5;
                            ">
                                Velmio
                            </h1>
                        </td>
                    </tr>

                    <!-- Email Content -->
                    <tr>
                        <td style="padding: 20px 35px 35px;">

                            {% block content %}
                            {% endblock %}

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="
                            padding: 25px 30px;
                            background-color: #f9fafb;
                            border-top: 1px solid #e5e7eb;
                        ">

                            <p style="
                                margin: 0 0 10px;
                                font-size: 12px;
                                color: #6b7280;
                            ">
                                This email was sent because an account was
                                created on Velmio.
                            </p>

                            <p style="
                                margin: 0;
                                font-size: 12px;
                                color: #9ca3af;
                            ">
                                &copy; {{ current_year }} Velmio.
                                All rights reserved.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>
</html>
